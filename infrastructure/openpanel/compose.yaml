# Adapted from Coolify OpenPanel 2.x template; see README.md.
services:
  openpanel-dashboard:
    image: lindesvard/openpanel-dashboard:2
    environment:
      - NODE_ENV=production
      - SELF_HOSTED=true
      - API_URL=${OPENPANEL_PUBLIC_URL:-https://analytics.amblydia.com}/api
      - DASHBOARD_URL=${OPENPANEL_PUBLIC_URL:-https://analytics.amblydia.com}
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
      - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
      - CLICKHOUSE_URL=http://clickhouse:8123/openpanel
    depends_on:
      openpanel-api:
        condition: service_healthy
      openpanel-worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:3000/api/healthcheck || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  openpanel-api:
    image: lindesvard/openpanel-api:2
    command: |
      sh -c "
        echo 'Running migrations...'
        CI=true pnpm -r run migrate:deploy

        pnpm start
      "
    environment:
      - NODE_ENV=production
      - SELF_HOSTED=true
      - API_URL=${OPENPANEL_PUBLIC_URL:-https://analytics.amblydia.com}/api
      - DASHBOARD_URL=${OPENPANEL_PUBLIC_URL:-https://analytics.amblydia.com}
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
      - DATABASE_URL_DIRECT=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
      - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
      - CLICKHOUSE_URL=http://clickhouse:8123/openpanel
      - COOKIE_SECRET=${SERVICE_BASE64_COOKIESECRET}
      - ALLOW_REGISTRATION=${OPENPANEL_ALLOW_REGISTRATION:-false}
      - ALLOW_INVITATION=${OPENPANEL_ALLOW_INVITATION:-false}
      - EMAIL_SENDER=${OPENPANEL_EMAIL_SENDER}
      - RESEND_API_KEY=${RESEND_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:3000/healthcheck || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
  openpanel-worker:
    image: lindesvard/openpanel-worker:2
    environment:
      - DISABLE_BULLBOARD=${DISABLE_BULLBOARD:-1}
      - NODE_ENV=production
      - SELF_HOSTED=true
      - API_URL=${OPENPANEL_PUBLIC_URL:-https://analytics.amblydia.com}/api
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
      - DATABASE_URL_DIRECT=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
      - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
      - CLICKHOUSE_URL=http://clickhouse:8123/openpanel
    depends_on:
      openpanel-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:3000/healthcheck || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  postgres:
    image: postgres:16-alpine
    volumes:
      - openpanel_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${OPENPANEL_POSTGRES_DB:-openpanel-db}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7.4-alpine
    volumes:
      - openpanel_redis_data:/data
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS} --maxmemory-policy
      noeviction
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${SERVICE_PASSWORD_REDIS}
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
  clickhouse:
    image: clickhouse/clickhouse-server:25.10.2.65
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - openpanel_clickhouse_data:/var/lib/clickhouse
      - openpanel_clickhouse_logs:/var/log/clickhouse-server
      - type: bind
        source: ./clickhouse-config.xml
        target: /etc/clickhouse-server/config.d/op-config.xml
        read_only: true
      - type: bind
        source: ./clickhouse-user-config.xml
        target: /etc/clickhouse-server/users.d/op-user-config.xml
        read_only: true
      - type: bind
        source: ./init-db.sh
        target: /docker-entrypoint-initdb.d/init-db.sh
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --query "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
  gateway:
    image: nginx:stable-alpine
    environment:
      - SERVICE_URL_ANALYTICS_8080
    expose:
      - "8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      openpanel-api:
        condition: service_healthy
      openpanel-dashboard:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  openpanel_postgres_data: {}
  openpanel_redis_data: {}
  openpanel_clickhouse_data: {}
  openpanel_clickhouse_logs: {}
