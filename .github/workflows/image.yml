name: Image

# Builds the image (after the Dockerfile `test` stage passes) and pushes it to
# ghcr.io/bedrocknexus/hub. Nothing is deployed from here: production is
# redeployed by hand in Coolify, which pulls the `latest` tag and never builds
# source itself.
# Pipeline: https://github.com/BedrockNexus/github-actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Check build variables
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require public build variables
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ vars.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_CONVEX_URL NEXT_PUBLIC_CONVEX_SITE_URL NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_API_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository variable ${name} (Settings > Secrets and variables > Actions > Variables)."
              missing=1
            fi
          done
          exit "$missing"

  image:
    needs: config
    uses: BedrockNexus/github-actions/.github/workflows/docker-build.yml@main
    with:
      push: true
      test-target: test
      # Public values only: build arguments are visible in the image.
      build-args: |
        NEXT_PUBLIC_CONVEX_URL=${{ vars.NEXT_PUBLIC_CONVEX_URL }}
        NEXT_PUBLIC_CONVEX_SITE_URL=${{ vars.NEXT_PUBLIC_CONVEX_SITE_URL }}
        NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
        NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
